name: IzzyDrop pre-release readiness

on:
  push:
    branches:
      - feat/pre-release-readiness
    paths:
      - 'login.html'
      - 'login.js'
      - 'supplier.html'
      - 'supplier-onboarding.js'
      - 'verification-center.js'
      - 'store-manager.js'
      - 'store-dashboard.js'
      - 'storefront.html'
      - 'storefront.js'
      - 'storefront.css'
      - 'admin.html'
      - 'admin.js'
      - 'admin-accounts.js'
      - 'admin-payout-directory.js'
      - 'supabase/migrations/20261118120000_pre_release_verification_admin.sql'
      - 'supabase/migrations/20261118130000_native_storefront_checkout.sql'
      - 'supabase/migrations/20261118140000_admin_order_inventory_controls.sql'
      - 'supabase/functions/native-storefront-gateway/**'
      - 'qa/pre-release-readiness.test.cjs'
      - '.github/workflows/pre-release-readiness.yml'
  pull_request:
    branches: [main]
    paths:
      - 'login.html'
      - 'login.js'
      - 'supplier.html'
      - 'supplier-onboarding.js'
      - 'verification-center.js'
      - 'store-manager.js'
      - 'store-dashboard.js'
      - 'storefront.html'
      - 'storefront.js'
      - 'storefront.css'
      - 'admin.html'
      - 'admin.js'
      - 'admin-accounts.js'
      - 'admin-payout-directory.js'
      - 'supabase/migrations/20261118120000_pre_release_verification_admin.sql'
      - 'supabase/migrations/20261118130000_native_storefront_checkout.sql'
      - 'supabase/migrations/20261118140000_admin_order_inventory_controls.sql'
      - 'supabase/functions/native-storefront-gateway/**'
      - 'qa/pre-release-readiness.test.cjs'
      - '.github/workflows/pre-release-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser JavaScript syntax
        run: |
          node --check login.js
          node --check supplier-onboarding.js
          node --check verification-center.js
          node --check store-manager.js
          node --check store-dashboard.js
          node --check storefront.js
          node --check admin.js
          node --check admin-accounts.js
          node --check admin-payout-directory.js
      - name: Run launch-scope regression tests
        run: |
          node --test qa/pre-release-readiness.test.cjs
          node --test qa/native-storefront-regression.test.cjs
          node --test qa/pilot-onboarding.test.cjs

  migration-sql-parse:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PostgreSQL SQL parser
        run: python -m pip install --disable-pip-version-check pglast
      - name: Parse staged migration SQL
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files = [
              "supabase/migrations/20261118120000_pre_release_verification_admin.sql",
              "supabase/migrations/20261118130000_native_storefront_checkout.sql",
              "supabase/migrations/20261118140000_admin_order_inventory_controls.sql",
          ]
          for filename in files:
              parse_sql(Path(filename).read_text())
              print("SQL parse passed:", filename)
          PY

  edge-function-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check public native storefront gateway
        run: deno check supabase/functions/native-storefront-gateway/index.ts
