name: Hosted storefront v1 regression

on:
  pull_request:
    branches: [main]
    paths:
      - 'app.html'
      - 'app.js'
      - 'store.html'
      - 'store.js'
      - 'store-manager.js'
      - 'storefront.css'
      - 'supabase/functions/public-storefront/**'
      - 'supabase/migrations/20261026170000_dropshipper_hosted_storefront_v1.sql'
      - 'qa/storefront-v1.test.cjs'
      - '.github/workflows/storefront-v1-regression.yml'
  push:
    branches: [feat/dropshipper-hosted-storefront-v1]
    paths:
      - 'app.html'
      - 'app.js'
      - 'store.html'
      - 'store.js'
      - 'store-manager.js'
      - 'storefront.css'
      - 'supabase/functions/public-storefront/**'
      - 'supabase/migrations/20261026170000_dropshipper_hosted_storefront_v1.sql'
      - 'qa/storefront-v1.test.cjs'
      - '.github/workflows/storefront-v1-regression.yml'

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Check browser JavaScript syntax
        run: |
          node --check app.js
          node --check store-manager.js
          node --check store.js
      - name: Check public storefront Edge Function types
        run: deno check --no-lock supabase/functions/public-storefront/index.ts
      - name: Verify storefront isolation, privacy, and phase-one scope
        run: node qa/storefront-v1.test.cjs
