name: Order retry browser check
on:
  pull_request:
    paths: ['app.js', 'tests/e2e/order-retry.cjs', '.github/workflows/order-retry.yml']
permissions:
  contents: read
jobs:
  order-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix "$RUNNER_TEMP/qa" --no-audit --no-fund playwright@1.56.1
      - run: node "$RUNNER_TEMP/qa/node_modules/playwright/cli.js" install --with-deps chromium
      - run: NODE_PATH="$RUNNER_TEMP/qa/node_modules" node tests/e2e/order-retry.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-retry-results
          path: qa-results/
