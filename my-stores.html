<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Stores · IzzyDrop</title><meta name="description" content="Create and manage your IzzyDrop storefronts.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=20261011-dropshipper-mobilemenu1">
<link rel="stylesheet" href="store-manager.css?v=20261108-multistore1">
<script src="config.js"></script><script src="common.js?v=20261006-sessioncheck1"></script>
<link rel="stylesheet" href="multi-store.css?v=20261108-multistore1">
</head>
<body class="store-manager-page my-stores-page">
<div class="wrap store-manager-wrap">
<header class="nav store-manager-nav">
<a class="brand" href="app.html"><span class="brand-mark">IZ</span><span class="brand-word">IzzyDrop</span><span class="brand-role">Dropshipper</span></a>
<div class="navlinks"><a href="app.html">Workspace</a></div>
</header>
<main class="store-manager-main">
<section id="stores-overview">
<div class="store-manager-heading">
<div><div class="store-manager-eyebrow">YOUR STORES</div><h1>My Stores</h1><p class="muted">Create, customize, and manage your online stores from one place.</p></div>
<button class="btn" id="create-store-btn">Create a store</button>
</div>
<div id="stores-status" class="status" role="status" aria-live="polite"></div>
<div id="stores-grid" class="my-stores-grid"><div class="store-manager-empty">Loading your stores…</div></div>
</section>

<section id="create-store-panel" class="card create-store-panel" hidden>
<div class="store-section-heading"><div><div class="store-manager-eyebrow">NEW STOREFRONT</div><h2>Create your store</h2><p class="muted">Start with your store identity. You can customize the design and add products next.</p></div></div>
<form id="create-store-form" class="store-profile-form">
<label>Store name<input id="new-store-name" maxlength="80" minlength="2" required placeholder="Your brand name"></label>
<label>Store link<input id="new-store-slug" maxlength="48" required pattern="[a-z0-9]+(-[a-z0-9]+)*" autocomplete="off" placeholder="your-brand"><small>Lowercase letters, numbers and hyphens. This becomes your public store address.</small></label>
<label class="store-description-field">Short description<textarea id="new-store-description" maxlength="800" rows="3" placeholder="What does your store sell?"></textarea></label>
<div class="store-profile-actions"><button class="btn" type="submit" id="create-store-submit">Create store</button><button class="btn secondary" type="button" id="cancel-create-store">Cancel</button></div>
</form>
</section>
</main>
</div>
<script src="storefront-i18n.js?v=20261108-arabic-store2"></script>
<script src="my-stores.js?v=20261108-multistore1"></script>
</body></html>
