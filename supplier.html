<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IzzyDrop Supplier Hub</title><link rel="stylesheet" href="styles.css"></head><body><div class="wrap"><header class="nav"><a class="brand" href="index.html">IzzyDrop <span>Supplier</span></a><div class="navlinks"><a class="btn ghost" href="index.html">Marketplace</a></div></header><div id="auth" class="auth-shell"><div class="auth-card"><div class="eyebrow">Supplier hub</div><h1>Put your products in front of sellers.</h1><p class="muted">Approved suppliers can manage products and stock directly in IzzyDrop.</p><div class="tabs"><button class="tab on" data-mode="login">Log in</button><button class="tab" data-mode="signup">Apply</button></div><form id="login-form" class="form"><input id="login-email" type="email" placeholder="Email" required><input id="login-password" type="password" placeholder="Password" required><button class="btn">Log in</button></form><form id="signup-form" class="form" hidden><input id="signup-name" placeholder="Your name" required><input id="signup-business" placeholder="Business name" required><input id="signup-email" type="email" placeholder="Email" required><input id="signup-password" type="password" minlength="6" placeholder="Password" required><button class="btn">Create supplier application</button></form><div id="auth-status" class="status"></div></div></div><div id="supplier" hidden><div class="dash"><aside class="side"><div class="brand">IzzyDrop</div><nav><button class="on" data-view="overview">Overview</button><button data-view="products">Products</button><button data-view="add">Add product</button></nav></aside><main class="main"><header class="dash-head"><div><h1>Supplier dashboard</h1><div id="business" class="muted"></div></div><button id="logout" class="btn secondary">Sign out</button></header><div id="status" class="status"></div><section id="view-overview" class="view"><div class="stat-grid"><div class="card stat">Products<strong id="product-count">—</strong></div><div class="card stat">Active<strong id="active-count">—</strong></div><div class="card stat">Total stock<strong id="stock-count">—</strong></div></div></section><section id="view-products" class="view" hidden><h2>Products</h2><div id="products" class="list"></div></section><section id="view-add" class="view" hidden><div class="card"><h2>Add product</h2><form id="add-form" class="form"><input id="p-name" placeholder="Product name" required><input id="p-sku" placeholder="SKU" required><input id="p-cost" type="number" step="0.01" min="0" placeholder="Your cost (EGP)" required><input id="p-retail" type="number" step="0.01" min="0" placeholder="Suggested retail (EGP)" required><input id="p-stock" type="number" min="0" step="1" placeholder="Stock" required><textarea id="p-description" placeholder="Description"></textarea><button class="btn">Add product</button></form></div></section></main></div></div></div><script src="config.js"></script><script src="common.js"></script><script src="supplier.js"></script></body></html>
